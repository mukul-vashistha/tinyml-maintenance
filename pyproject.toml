[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyml-maintenance"
version = "0.1.0"
description = "An AI-assisted classical ML engineering playbook built around predictive maintenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1,<4",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
tinyml-maintenance = "tinyml_maintenance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyml_maintenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
